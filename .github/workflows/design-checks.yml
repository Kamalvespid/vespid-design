name: Design checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cast drawings in sync across both skills
        run: python3 tools/check_cast_sync.py
      - name: Exported SVGs are export-safe
        run: python3 tools/lint_svg.py
